<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570">
  <rect width="960" height="570" fill="#ffffff"/>
  <text x="24" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f2328">Les 10 derniers commits de master</text>
  <text x="24" y="54" font-family="sans-serif" font-size="12" fill="#57606a">24/09/2026, de 22:13 à 22:42 — deux fusions, trois changements de protocole</text>

  <!-- lignes du graphe -->
  <g fill="none" stroke-width="2.5">
    <line x1="40" y1="90" x2="40" y2="222" stroke="#8250df"/>
    <path d="M40 90 C40 112, 70 112, 70 134" stroke="#0969da"/>
    <line x1="70" y1="134" x2="70" y2="178" stroke="#0969da"/>
    <path d="M70 178 C70 200, 40 200, 40 222" stroke="#0969da"/>
    <line x1="40" y1="222" x2="40" y2="520" stroke="#8250df" stroke-dasharray="5 4"/>
    <path d="M40 222 C40 244, 70 244, 70 266" stroke="#0969da"/>
    <line x1="70" y1="266" x2="70" y2="486" stroke="#0969da"/>
    <line x1="70" y1="486" x2="70" y2="520" stroke="#0969da" stroke-dasharray="5 4"/>
  </g>
  <text x="46" y="536" font-family="monospace" font-size="11" fill="#57606a">ba85314 …</text>
  <text x="76" y="552" font-family="monospace" font-size="11" fill="#57606a">f2feaf1 …</text>

  <!-- nœuds -->
  <g stroke="#ffffff" stroke-width="2">
    <circle cx="40" cy="90"  r="8" fill="#8250df"/>
    <circle cx="70" cy="134" r="7" fill="#bc4c00"/>
    <circle cx="70" cy="178" r="7" fill="#0969da"/>
    <circle cx="40" cy="222" r="8" fill="#8250df"/>
    <circle cx="70" cy="266" r="7" fill="#0969da"/>
    <circle cx="70" cy="310" r="7" fill="#bc4c00"/>
    <circle cx="70" cy="354" r="7" fill="#0969da"/>
    <circle cx="70" cy="398" r="7" fill="#0969da"/>
    <circle cx="70" cy="442" r="7" fill="#0969da"/>
    <circle cx="70" cy="486" r="7" fill="#bc4c00"/>
  </g>

  <!-- libellés -->
  <g font-family="monospace" font-size="12" fill="#57606a">
    <text x="110" y="94">03fea1f</text><text x="180" y="94">22:42</text>
    <text x="110" y="138">dd7f574</text><text x="180" y="138">22:42</text>
    <text x="110" y="182">a3f7161</text><text x="180" y="182">22:38</text>
    <text x="110" y="226">245646a</text><text x="180" y="226">22:33</text>
    <text x="110" y="270">83bedcc</text><text x="180" y="270">22:28</text>
    <text x="110" y="314">eee6ab5</text><text x="180" y="314">22:26</text>
    <text x="110" y="358">2f1dd13</text><text x="180" y="358">22:22</text>
    <text x="110" y="402">21eabd1</text><text x="180" y="402">22:19</text>
    <text x="110" y="446">f245bb0</text><text x="180" y="446">22:17</text>
    <text x="110" y="490">4552ee3</text><text x="180" y="490">22:13</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#1f2328">
    <text x="232" y="94"><tspan font-weight="bold" fill="#8250df">Fusion :</tspan> fermer un nœud demande, et le + d'une carte ajoute ce qu'on veut</text>
    <text x="232" y="138"><tspan font-weight="bold" fill="#bc4c00">Protocole 55 :</tspan> le + d'une carte ajoute un terminal, un agent, une note ou un diagramme</text>
    <text x="232" y="182"><tspan font-weight="bold" fill="#0969da">Accueil :</tspan> fermer demande — masquer ou supprimer — et les masqués reviennent</text>
    <text x="232" y="226"><tspan font-weight="bold" fill="#8250df">Fusion :</tspan> les nœuds de l'accueil deviennent des fichiers, lisibles par les agents</text>
    <text x="232" y="270"><tspan font-weight="bold" fill="#0969da">Accueil :</tspan> fusionner depuis une carte, archiver une revue close</text>
    <text x="232" y="314"><tspan font-weight="bold" fill="#bc4c00">Protocole 54 :</tspan> les diagrammes deviennent des nœuds</text>
    <text x="232" y="358"><tspan font-weight="bold" fill="#0969da">Revues :</tspan> les remarques dans le diff et le panneau Notes, et vers l'agent</text>
    <text x="232" y="402"><tspan font-weight="bold" fill="#0969da">Accueil :</tspan> un nœud écrit par un agent apparaît tout de suite</text>
    <text x="232" y="446"><tspan font-weight="bold" fill="#0969da">Accueil :</tspan> une revue se lit, ses remarques s'ouvrent et se résolvent</text>
    <text x="232" y="490"><tspan font-weight="bold" fill="#bc4c00">Protocole 53 :</tspan> un agent voit son environnement, et la skill Claudhub</text>
  </g>

  <!-- légende -->
  <g font-family="sans-serif" font-size="12" fill="#57606a">
    <circle cx="560" cy="540" r="6" fill="#8250df"/><text x="572" y="544">fusion</text>
    <circle cx="640" cy="540" r="6" fill="#bc4c00"/><text x="652" y="544">protocole du fil</text>
    <circle cx="770" cy="540" r="6" fill="#0969da"/><text x="782" y="544">fonctionnalité</text>
  </g>
</svg>
