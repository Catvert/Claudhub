# La CI de la découpe UI ↔ serveur.
#
# Trois jambes, chacune avec son rôle :
# - `coeur` (ubuntu) : les tests du cœur sans la feature `ui` — dont
#   `tests/server_wire.rs`, qui exerce le vrai binaire serveur et tout le
#   fil — plus le portillon `check-server`. La jambe ne compile pas gpui :
#   la parité complète avec le poste de dev reste à `just check/clippy/test`
#   sous nix-shell.
# - `serveur-musl` (ubuntu) : le binaire `claudhub-server` statique, celui
#   que le `.exe` installera dans la distro WSL2. C'est aussi le juge de
#   paix du risque « sqlx + musl » (libsqlite3-sys est compilé par musl-gcc).
# - `windows` : d'abord un spike de compilation (gpui + le fork
#   gpui-component sur msvc), puis le `.exe` livrable.
#
# `CLAUDHUB_BUILD_ID` entre dans la poignée de main (`wire::Hello.build`) via
# `option_env!` : deux artefacts d'un même commit se reconnaissent.

name: ci

on:
  push:
    branches: [master]
    # Un tag `ci-…` déclenche la CI depuis n'importe quelle branche : tant que
    # ce fichier n'est pas sur la branche par défaut, `workflow_dispatch` ne
    # sait pas le voir, et c'est le seul moyen de lancer le spike Windows sans
    # écrire dans master.
    tags: ["ci-*"]
  pull_request:
  workflow_dispatch:

env:
  CLAUDHUB_BUILD_ID: ${{ github.sha }}
  CARGO_TERM_COLOR: always

jobs:
  coeur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests du cœur (sans gpui)
        run: cargo test --no-default-features
      - name: Portillon du serveur
        run: cargo check --no-default-features --bin claudhub-server

  serveur-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Outils musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Binaire serveur statique
        run: cargo build --release --no-default-features --bin claudhub-server --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: claudhub-server-musl
          path: target/x86_64-unknown-linux-musl/release/claudhub-server

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Le spike de la phase P3 : tant que `cargo check` n'est pas vert ici,
      # inutile de payer un build release. Le jour où il l'est, ce pas et le
      # suivant font le `.exe` livrable.
      - name: Compilation (spike gpui/fork sur msvc)
        run: cargo check --bin claudhub
      - name: Binaire release
        run: cargo build --release --bin claudhub
      - uses: actions/upload-artifact@v4
        with:
          name: claudhub-windows
          path: target/release/claudhub.exe
