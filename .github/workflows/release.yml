# Builds and publishes a release.
#
# Tags only: a release is a deliberate act, and every one of these jobs costs
# a full rebuild of the gpui tree. Day-to-day checking is `just check`,
# `just clippy`, `just test` and `just check-server` on the developer's
# machine — the same gates this workflow runs, minus the packaging.
#
# Two deliverables, one per platform, and each is a single self-contained
# file — nothing to unzip, nothing to place beside anything:
#   - Windows: one .exe carrying the musl server inside it (build.rs), which it
#     installs into the WSL distribution on first launch. Hence the ordering
#     here: the server leg must finish before the Windows leg compiles.
#   - Linux: an AppImage and a self-extracting .run, both carrying the whole
#     nix closure (see tools/make_appimage.sh).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Needed by the publish job to create the GitHub release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Travels into the handshake through `option_env!` (wire::Hello.build), so
  # two artifacts built from the same commit recognise each other.
  CLAUDHUB_BUILD_ID: ${{ github.sha }}

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Without the `ui` feature: this leg never compiles gpui, so it is also
      # the gate proving no core module depends on it.
      - name: Test the core without gpui
        run: cargo test --no-default-features
      - name: Check the headless server
        run: cargo check --no-default-features --bin claudhub-server

  server:
    name: Server (static musl)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Static on purpose: this binary is copied into whatever WSL
      # distribution the user picked, and must not expect a glibc it has
      # never met.
      - name: Build the server
        run: >-
          cargo build --release --no-default-features --bin claudhub-server
          --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: server-musl
          path: target/x86_64-unknown-linux-musl/release/claudhub-server
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    needs: server
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Downloaded before the build, not after: the server is compiled *into*
      # the executable (see build.rs), so a single file ships and no user can
      # end up holding one half of a pair.
      - uses: actions/download-artifact@v4
        with:
          name: server-musl
          path: server
      - name: Build the application
        env:
          CLAUDHUB_EMBED_SERVER: ${{ github.workspace }}\server\claudhub-server
        run: cargo build --release --bin claudhub
      - name: Name the executable for the release page
        shell: bash
        run: |
          mkdir -p bundle
          cp target/release/claudhub.exe bundle/Claudhub-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: claudhub-windows-x86_64
          path: bundle/Claudhub-x86_64.exe
          if-no-files-found: error

  linux:
    name: Linux (AppImage)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      # Skipped unless the CACHIX_CACHE repository variable names a cache.
      # No default: a guessed name fails the whole leg with "cache doesn't
      # exist", and losing the release over a cache is a bad trade — without
      # it the closure is merely rebuilt.
      - uses: cachix/cachix-action@v15
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # cargo comes from rustup, not from shell.nix: `nix-shell` is not pure
      # here, so the toolchain on PATH stays reachable inside it.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the application
        run: nix-shell --quiet --run "cargo build --release --bin claudhub"
      # Outside nix-shell on purpose: the script enters it by itself, and
      # needs the host's view of the store to walk the closure.
      - name: Package the AppImage
        run: tools/make_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: claudhub-linux-x86_64
          path: |
            target/appimage/Claudhub-x86_64.AppImage
            target/appimage/Claudhub-x86_64.run
          if-no-files-found: error

  publish:
    name: Publish
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Prepended to the generated notes. Which file to take, and what to do
      # with it, is the first question a release page has to answer.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body: |
            ## Installation

            **Windows** — `Claudhub-x86_64.exe`, un seul fichier, rien à
            installer. Au premier démarrage il demande dans quelle distribution
            WSL2 travailler, y pose le serveur qu'il porte en lui, et s'y
            connecte. La machine doit avoir WSL2 avec une distribution, et
            `git` dedans.

            **Linux** — `Claudhub-x86_64.run` de préférence : il ne demande que
            `sh`, `tar` et `gzip`, et se déballe une fois dans `~/.cache`.
            `Claudhub-x86_64.AppImage` porte le même contenu mais exige un
            `fusermount` sur la machine. Les deux embarquent leurs
            bibliothèques ; le pilote Vulkan, `git` et l'agent viennent de
            l'hôte.

            ---
          files: |
            artifacts/claudhub-windows-x86_64/Claudhub-x86_64.exe
            artifacts/claudhub-linux-x86_64/Claudhub-x86_64.AppImage
            artifacts/claudhub-linux-x86_64/Claudhub-x86_64.run
