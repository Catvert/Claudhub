[package]
name = "claudhub"
version = "0.7.3"
edition = "2021"
description = "Poste de travail pour la revue de code et le pilotage d'agents de codage en terminal, par worktree git"
license = "Apache-2.0"
readme = "README.md"
rust-version = "1.90"
publish = false

# Une bibliothèque et deux binaires : l'interface, et le serveur headless qui
# fait tourner les mêmes workers dans WSL2 quand l'interface est un `.exe`
# Windows. La feature `ui` (par défaut) porte tout ce qui touche gpui ; le
# serveur se construit avec `--no-default-features`, ce qui garantit qu'aucun
# module du cœur n'en dépend — c'est le portillon, pas une optimisation.
[[bin]]
name = "claudhub"
path = "src/main.rs"
required-features = ["ui"]

[[bin]]
name = "claudhub-server"
path = "src/bin/server.rs"

[features]
default = ["ui"]
ui = [
    "dep:gpui",
    "dep:gpui_platform",
    "dep:gpui-component",
    "dep:gpui-base",
    "dep:rust-embed",
    "dep:tree-sitter-php",
    "dep:tree-sitter-nix",
    "dep:tree-sitter-containerfile",
    "dep:codebook-tree-sitter-just",
    "dep:tree-sitter",
    "dep:alacritty_terminal",
    "dep:lsp-types",
    "dep:rust-i18n",
    "dep:keyring",
]

[dependencies]
# UI : gpui (le framework de Zed) et gpui-component (dock, listes virtualisées,
# sidebar, inputs, thèmes, coloration syntaxique tree-sitter).
# gpui-component suit son `main` : la version publiée (0.5.1) date d'avant la
# refonte du dock — moteur de disposition séparé (`gpui-base`), `DockLayout` en
# valeur, et une peau (`DockSkin`) qu'on peut remplacer. Le `main` de
# gpui-component compile contre le gpui du dépôt de Zed, pas contre celui de
# crates.io : les deux doivent donc pointer sur la même révision, faute de quoi
# cargo compile deux crates `gpui` distinctes et rien ne s'accorde. La
# révision n'est donc **pas** épinglée ici : gpui-component déclare son gpui
# sans révision, et un `rev` de notre côté suffirait à en faire deux sources
# différentes — neuf cents erreurs de types identiques mais étrangers.
# `Cargo.lock` fige le commit ; c'est lui qui rend la construction reproductible.
gpui = { git = "https://github.com/zed-industries/zed", optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", optional = true, features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
# `tree-sitter-languages` fournit entre autres la grammaire `diff`, qui colore
# les hunks de la vue de revue sans que nous écrivions un lexer.
# Notre fork, branche `claudhub` : un seul commit au-dessus de leur `main`, qui
# laisse la peau du dock choisir le variant des onglets (`set_tab_variant`) —
# le rayon du variant par défaut est un zéro codé en dur. Le commit a vocation
# à partir en PR ; le fork disparaîtra avec elle.
gpui-component = { git = "https://github.com/Catvert/gpui-component", branch = "claudhub", optional = true, features = [
    "tree-sitter-languages",
] }
# La couche de base tient sa propre copie du thème (poignées, barres de
# défilement) : éteindre la ligne d'une poignée de redimensionnement s'écrit
# dans son global à elle, que gpui-component ne réexporte pas.
gpui-base = { git = "https://github.com/Catvert/gpui-component", branch = "claudhub", optional = true }
# Assets embarqués (icônes Lucide, polices) servis à gpui via AssetSource.
rust-embed = { version = "8", optional = true }

# PHP n'est pas dans les grammaires que gpui-component embarque, et c'est le
# langage de la moitié des dépôts que Claudhub sert à relire. La grammaire est
# donc enregistrée à la main dans son registre (voir ui::highlight).
tree-sitter-php = { version = "0.24", optional = true }

# Nix non plus n'y est pas, et c'est le langage du `shell.nix` de ce dépôt : on
# relit un diff de `shell.nix` ou de `flake.nix` en même temps que le reste.
tree-sitter-nix = { version = "0.3", optional = true }

# Dockerfile non plus, et c'est un fichier qu'on relit dans presque tous les
# dépôts servis. `containerfile` et non `tree-sitter-dockerfile`, resté à
# l'ABI de tree-sitter 0.20 : celui-ci est tenu à jour, et ses injections
# rendent le corps d'un `RUN` à bash, ce qui est l'essentiel de ce qu'on lit
# dans un Dockerfile. Il ne dépend que de `tree-sitter-language`, la passerelle
# d'ABI, donc rien d'autre n'entre dans l'arbre.
tree-sitter-containerfile = { version = "0.9", optional = true }

# `just` est la porte d'entrée de ce dépôt et de ceux qu'il sert — le `justfile`
# est le troisième niveau du système d'extension — et sa syntaxe n'est celle
# d'aucun autre langage : `:=`, `{{…}}`, les attributs `[private]`. La colorer
# en Make donnait des recettes justes et tout le reste faux.
#
# Le paquet est celui de `codebook` et non `tree-sitter-just`, l'officiel, pour
# une raison qui n'est pas un goût : celui-ci déclare `tree-sitter ~0.25.5` en
# dépendance **ferme** — alors qu'il ne s'en sert que dans ses tests — et la
# caisse porte `links = "tree-sitter"`, dont cargo n'accepte qu'un exemplaire
# dans tout le graphe. Deux versions ne se compilent donc pas côte à côte :
# c'est une erreur de résolution, pas un doublon. Celui-ci le déclare en
# dev-dependency, et expose ses requêtes — l'autre les laisse hors du paquet
# publié, derrière un `cfg` toujours éteint.
codebook-tree-sitter-just = { version = "0.1", optional = true }

# L'arbre lui-même, pour les replis de l'éditeur d'une vue Blade : gpui-component
# tient sa fonction d'extraction pour lui, et notre coloriseur doit la refaire
# (voir `ui::blade`). La version suit celle qu'il utilise, faute de quoi cargo
# compilerait deux crates `tree-sitter` étrangères l'une à l'autre.
tree-sitter = { version = "0.26", optional = true }

# Émulateur de terminal : le même que Zed et Alacritty. Il fournit le parseur
# VTE, la grille de cellules, le scrollback et l'ouverture du pty ; le rendu
# gpui des cellules est à nous (src/ui/terminal_view.rs).
alacritty_terminal = { version = "0.26", optional = true }

# Rafraîchit l'état d'un worktree quand les fichiers changent sous lui, plutôt
# que de lancer `git status` sur un minuteur.
notify = "8"
notify-debouncer-full = "0.5"

# `wt`, le gestionnaire de worktrees, en bibliothèque : c'est son `wt.toml`
# qui sert de système d'extension à Claudhub — tâches, questions, statuts,
# URLs. `default-features = false` écarte sa CLI et son interface plein écran,
# donc clap, ratatui et skim : nous n'appelons que le cœur.
#
# Par le dépôt distant et non par un chemin : Claudhub se compile alors sur une
# machine qui n'a pas `wt` à côté. `Cargo.lock` fige le commit — suivre `main`
# ne veut donc pas dire qu'un `cargo build` change de version tout seul, il
# faut un `cargo update -p wt`.
wt = { git = "https://github.com/Catvert/wt.git", branch = "main", default-features = false }

# Bases de données : `sqlx`, un seul pilote pour SQLite comme pour MySQL et
# MariaDB, et le même modèle de connexion pour le troisième moteur qu'on
# ajouterait. Il est asynchrone de bout en bout — d'où tokio ci-dessous — et
# c'est ce qui donne un vrai délai de requête : `timeout` laisse tomber le
# futur, là où un pilote bloquant doit être convaincu de s'arrêter tout seul.
# `runtime-tokio-rustls` reprend le rustls que `ureq` amène déjà, plutôt
# qu'OpenSSL. `default-features = false` écarte les macros de vérification à
# la compilation : nos requêtes sont écrites à l'exécution, il n'y a pas de
# schéma connu d'avance.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "mysql",
    "chrono",
    "json",
] }

# `TryStreamExt::try_next` : `sqlx` rend les résultats en flux, une
# instruction et une ligne à la fois, et c'est ce qui permet de s'arrêter à la
# fin d'une page sans lire ce qui suit.
futures = { version = "0.3", default-features = false, features = ["std"] }

# L'exécuteur asynchrone partagé (`runtime::executor`). Il est là pour `sqlx`
# aujourd'hui, et pour ce qui n'a pas d'interface bloquante demain — un client
# HTTP, des sous-processus lancés de front. Claudhub reste un programme à
# threads : le pont est un `block_on` dans le worker, à un seul endroit.
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
# Les dates de MySQL arrivent typées ; sans quoi un `DATETIME` s'afficherait
# en octets. `clock` en plus : la page des logs horodate en heure locale, et
# l'heure UTC d'un journal qu'on lit à côté de sa montre ne se compare à rien.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# HTTP bloquant pour l'API Sentry : `ureq` épouse le modèle à threads du
# runtime — un appel, une attente, rien à entrelacer — là où un client async
# imposerait tokio pour deux requêtes. `zed-reqwest` traîne déjà dans l'arbre
# via gpui-component, mais en dépendre transitivement serait fragile.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

# Les complétions de la console SQL passent par le fournisseur LSP de
# gpui-component, dont la signature est faite de types `lsp_types`. La version
# est celle que gpui-component déclare : deux versions différentes feraient
# deux traits `CompletionProvider` étrangers l'un à l'autre.
lsp-types = { version = "0.97", optional = true, features = ["proposed"] }

# Le trousseau du système, pour qu'un jeton n'ait pas à vivre en clair dans
# `settings.json`. Sous la feature `ui`, donc **côté interface** et jamais
# dans le serveur musl : un trousseau appartient à une session de bureau, qui
# est du côté Windows quand les workers tournent dans WSL — et le sortir du
# cœur évite du même coup une dépendance D-Bus dans un binaire statique.
keyring = { version = "4", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Le format du fil entre l'interface et `claudhub-server` (runtime::wire).
# Binaire et non JSON : `Evt::Agents` porte une `HashMap<PathBuf, …>` que JSON
# refuse en clé, et un `Evt::FileDiff` de relecture d'agent pèse trois à cinq
# fois plus en texte. Postcard n'a aucun bouton de configuration à désaccorder
# entre les deux bouts, là où bincode 2 en a plusieurs.
postcard = { version = "1", default-features = false, features = ["use-std"] }
toml = "0.9"
# Le JUnit d'un run Pest. Déjà dans l'arbre par une dépendance de gpui : la
# version épinglée est celle du lock, et n'ajoute rien au vendorage.
roxmltree = "0.21"
anyhow = "1"
directories = "6"
log = "0.4"
env_logger = "0.11"
# Le worker git, la surveillance de fichiers et les terminaux parlent au
# thread d'interface par des canaux que draine une tâche gpui.
async-channel = "2"
# UI en français et en anglais ; toute chaîne visible passe par `tr!`.
rust-i18n = { version = "4", optional = true }
interprocess = { version = "2.4.3", default-features = false }

[profile.dev]
# gpui et son graphe (blade, tree-sitter, alacritty) sont insupportables en
# debug ; seul notre crate reste en opt-level 0 pour garder l'itération rapide.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# L'icône et les métadonnées de l'exécutable Windows, posées par `build.rs`.
# Cible-conditionnelle : compiler ce build-dep sous Linux n'apporterait rien, et
# la règle des trois couches vaut aussi pour ce qu'on demande à cargo de bâtir.
# `default-features = false` retire la lecture du `[package.metadata]`, que nous
# ne remplissons pas — les champs sont écrits en toutes lettres dans `build.rs`.
# Tuer le *groupe* d'un run de tests (suite.rs) : `Child::kill` n'atteint que
# la racine, et une suite est un arbre — workers paratest, serveur Playwright.
[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }
