[package]
name = "claudhub"
version = "0.1.0"
edition = "2021"
description = "Poste de travail pour la revue de code et le pilotage d'agents de codage en terminal, par worktree git"
license = "Apache-2.0"
readme = "README.md"
rust-version = "1.90"
publish = false

[dependencies]
# UI : gpui (le framework de Zed) et gpui-component (dock, listes virtualisées,
# sidebar, inputs, thèmes, coloration syntaxique tree-sitter).
# gpui-component suit son `main` : la version publiée (0.5.1) date d'avant la
# refonte du dock — moteur de disposition séparé (`gpui-base`), `DockLayout` en
# valeur, et une peau (`DockSkin`) qu'on peut remplacer. Le `main` de
# gpui-component compile contre le gpui du dépôt de Zed, pas contre celui de
# crates.io : les deux doivent donc pointer sur la même révision, faute de quoi
# cargo compile deux crates `gpui` distinctes et rien ne s'accorde. La
# révision n'est donc **pas** épinglée ici : gpui-component déclare son gpui
# sans révision, et un `rev` de notre côté suffirait à en faire deux sources
# différentes — neuf cents erreurs de types identiques mais étrangers.
# `Cargo.lock` fige le commit ; c'est lui qui rend la construction reproductible.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
# `tree-sitter-languages` fournit entre autres la grammaire `diff`, qui colore
# les hunks de la vue de revue sans que nous écrivions un lexer.
# Notre fork, branche `claudhub` : un seul commit au-dessus de leur `main`, qui
# laisse la peau du dock choisir le variant des onglets (`set_tab_variant`) —
# le rayon du variant par défaut est un zéro codé en dur. Le commit a vocation
# à partir en PR ; le fork disparaîtra avec elle.
gpui-component = { git = "https://github.com/Catvert/gpui-component", branch = "claudhub", features = [
    "tree-sitter-languages",
] }
# La couche de base tient sa propre copie du thème (poignées, barres de
# défilement) : éteindre la ligne d'une poignée de redimensionnement s'écrit
# dans son global à elle, que gpui-component ne réexporte pas.
gpui-base = { git = "https://github.com/Catvert/gpui-component", branch = "claudhub" }
# Assets embarqués (icônes Lucide, polices) servis à gpui via AssetSource.
rust-embed = "8"

# PHP n'est pas dans les grammaires que gpui-component embarque, et c'est le
# langage de la moitié des dépôts que Claudhub sert à relire. La grammaire est
# donc enregistrée à la main dans son registre (voir ui::highlight).
tree-sitter-php = "0.24"

# Émulateur de terminal : le même que Zed et Alacritty. Il fournit le parseur
# VTE, la grille de cellules, le scrollback et l'ouverture du pty ; le rendu
# gpui des cellules est à nous (src/ui/terminal_view.rs).
alacritty_terminal = "0.26"

# Rafraîchit l'état d'un worktree quand les fichiers changent sous lui, plutôt
# que de lancer `git status` sur un minuteur.
notify = "8"
notify-debouncer-full = "0.5"

# `wt`, le gestionnaire de worktrees, en bibliothèque : c'est son `wt.toml`
# qui sert de système d'extension à Claudhub — tâches, questions, statuts,
# URLs. `default-features = false` écarte sa CLI et son interface plein écran,
# donc clap, ratatui et skim : nous n'appelons que le cœur.
#
# Par le dépôt distant et non par un chemin : Claudhub se compile alors sur une
# machine qui n'a pas `wt` à côté. `Cargo.lock` fige le commit — suivre `main`
# ne veut donc pas dire qu'un `cargo build` change de version tout seul, il
# faut un `cargo update -p wt`.
wt = { git = "https://github.com/Catvert/wt.git", branch = "main", default-features = false }

# HTTP bloquant pour l'API Sentry : `ureq` épouse le modèle à threads du
# runtime — un appel, une attente, rien à entrelacer — là où un client async
# imposerait tokio pour deux requêtes. `zed-reqwest` traîne déjà dans l'arbre
# via gpui-component, mais en dépendre transitivement serait fragile.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
anyhow = "1"
directories = "6"
log = "0.4"
env_logger = "0.11"
# Le worker git, la surveillance de fichiers et les terminaux parlent au
# thread d'interface par des canaux que draine une tâche gpui.
async-channel = "2"
# UI en français et en anglais ; toute chaîne visible passe par `tr!`.
rust-i18n = "4"

[profile.dev]
# gpui et son graphe (blade, tree-sitter, alacritty) sont insupportables en
# debug ; seul notre crate reste en opt-level 0 pour garder l'itération rapide.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
