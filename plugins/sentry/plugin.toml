# Sentry, en plugin.
#
# C'est le portillon d'acceptation que le système de plugins s'était donné : si
# Sentry ne se réécrivait pas ici sans qu'on ajoute une capacité taillée pour
# lui, l'API était fausse. Il a fallu deux choses, et aucune ne parle de
# Sentry — un lecteur JSON, que toute API HTTP réclame, et un état par dépôt,
# que toute configuration de projet réclame.
#
# Comme les thèmes, ce dossier est réécrit à chaque démarrage : pour le
# modifier, le copier sous un autre nom.

title = "Sentry"
icon = "triangle-alert"

capabilities = ["http"]

# Sans ces deux-là, il n'y a rien à montrer : les panneaux n'apparaissent pas,
# et la page des réglages dit ce qui manque. Le projet, lui, n'est pas ici — il
# appartient au dépôt et se choisit dans le panneau.
required = ["org", "token"]

# Le jeton est nommé par le script et **jamais lu par lui** : c'est le worker
# qui le substitue, dans un en-tête qui porte `{secret}`. Trois formes, dans la
# page « Plugins » : le jeton lui-même ; `$SENTRY_TOKEN`, lu dans
# l'environnement du worker ; ou `keyring:sentry`, lu dans le trousseau du
# système. Les deux dernières le gardent hors d'un fichier qu'on recopie.
secrets = ["token"]

# Deux panneaux : la liste des erreurs à gauche, celle qu'on a ouverte au
# centre. C'est le geste de tout le reste de la fenêtre — l'arbre du projet et
# l'éditeur, les occurrences et l'aperçu — et un seul panneau ne pouvait que
# les empiler, si bien que choisir une erreur poussait hors de vue la liste
# dans laquelle on choisissait.
#
# Les deux lisent le **même** état : c'est un script, une `init`, un `update`.
# Ce qui les distingue est l'identifiant que `view` reçoit en second argument.
[[panel]]
id = "issues"
title = "Erreurs"

[[panel]]
id = "issue"
title = "Erreur"
place = "centre"
icon = "bug"

[settings]
# L'organisation appartient à la machine ; le projet appartient au dépôt, et
# c'est `set_state` qui le retient — deux dépôts d'une même organisation n'ont
# pas les mêmes erreurs.
org = ""
host = "https://sentry.io"
query = "is:unresolved"
intro = "Cette erreur est remontée par Sentry. Voici sa trace et le code déployé au moment où elle s'est produite. Dis-moi ce qui la provoque, puis corrige-la."
