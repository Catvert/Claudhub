# Le plugin livré avec Claudhub : les exécutions de GitHub Actions du worktree.
#
# Il est là pour être lu autant que pour marcher — c'est la référence dont on
# part pour en écrire un autre. Comme les thèmes, ce dossier est **réécrit à
# chaque démarrage** : pour le modifier, le copier sous un autre nom.

title = "CI"
icon = "play"

# Déclarées et non devinées : un plugin qui atteint autre chose que ce qui est
# écrit ici se le voit refuser avant que quoi que ce soit ne parte.
capabilities = ["shell"]

# À droite, avec l'historique et les tags : une exécution répond « ce qui est
# arrivé à cette branche », pas « qu'y a-t-il à relire ». C'est le bord où l'on
# lit où l'on en est.
#
# Les clés de premier niveau viennent **avant** ce tableau : `[[panel]]` ouvre
# une table, et tout ce qui suit lui appartiendrait.
[[panel]]
id = "main"
title = "CI"
place = "right"

[settings]
# Le formatage est demandé à `gh` plutôt que fait ici : Rune n'a pas de lecteur
# JSON dans sa bibliothèque standard, et en écrire un ferait du plugin un sujet
# d'analyse syntaxique au lieu d'un tableau de CI. Rien n'est téléchargé — `gh`
# est un programme que l'utilisateur installe, comme les agents du terminal.
# `printf "%.0f"` sur l'identifiant, et ce n'est pas un raffinement : un modèle
# Go formate un nombre JSON en flottant, si bien que `{{.databaseId}}` rend
# `3.2494024323e+10` — un identifiant que `gh run view` ne reconnaît pas, et
# rien ne le dit avant le premier clic.
list = '''gh run list --limit 20 --json databaseId,displayTitle,workflowName,status,conclusion --template '{{range .}}{{printf "%.0f" .databaseId}}{{"\t"}}{{.displayTitle}}{{"\t"}}{{.workflowName}}{{"\t"}}{{.status}}{{"\t"}}{{.conclusion}}{{"\n"}}{{end}}' '''
log = "gh run view {id} --log-failed"
